name: 사이트 오류
description: 화면이 깨지거나 링크, 목차가 이상한 것을 알려 주세요.
title: "[사이트] "
labels: ["bug"]
body:
  - type: input
    id: page-url
    attributes:
      label: 페이지 주소
      placeholder: https://daily-report-ashy-nine.vercel.app/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 무엇이 문제인가요
      description: 어떻게 보였고, 어떻게 보여야 하는지 적어 주세요. 화면 캡처를 붙여 주시면 더 좋습니다.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 기기와 브라우저
      placeholder: 예) iPhone Safari, Windows Chrome
    validations:
      required: false
