name: 제안
description: 다뤘으면 하는 분야나 출처, 사이트 기능을 제안해 주세요.
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 제안 내용
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 어떤 상황에서 도움이 되는지 적어 주시면 우선순위를 정하는 데 참고합니다.
    validations:
      required: false
